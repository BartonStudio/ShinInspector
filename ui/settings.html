<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShinInspector 设置</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; padding: 32px;
      background: #1e1e1e; color: #eee;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p.hint { color: #9cdcfe; font-size: 13px; margin: 0 0 24px; }
    .option {
      display: block; width: 100%; max-width: 420px; text-align: left;
      margin: 0 0 12px; padding: 14px 16px;
      background: #252526; border: 1px solid #444; border-radius: 6px;
      cursor: pointer; color: #eee; font-family: inherit; font-size: 14px;
    }
    .option:hover { background: #2d2d2d; border-color: #0e639c; }
    .option b { display: block; font-size: 15px; margin-bottom: 4px; }
    .option span { display: block; color: #9cdcfe; font-size: 12px; }
  </style>
</head>
<body>
  <h1>ShinInspector 设置</h1>
  <p class="hint">选择远程通信方式（之后可在调试页左上角返回重新选择）</p>

  <button class="option" id="btnIpc">
    <b>进程间通信（IPC）</b>
    <span>WebView2 共享内存 + postMessage，本机零拷贝</span>
  </button>

  <button class="option" id="btnWs">
    <b>WebSocket（WS）</b>
    <span>连接 IObject 内置 WebSocket 服务端 ws://127.0.0.1:9002</span>
  </button>

  <script>
    function choose(mode) {
      localStorage.setItem('shin.mode', mode);
      location.href = 'index.html';
    }
    document.getElementById('btnIpc').onclick = () => choose('ipc');
    document.getElementById('btnWs').onclick = () => choose('ws');
  </script>
</body>
</html>
