<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShinInspector 设置</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; padding: 32px;
      background: #1e1e1e; color: #eee;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p.hint { color: #9cdcfe; font-size: 13px; margin: 0 0 20px; }
    .field { margin: 0 0 14px; padding: 12px 14px; background: #252526; border: 1px solid #444; border-radius: 6px; }
    .field label { cursor: pointer; font-size: 14px; }
    .field .desc { color: #9cdcfe; font-size: 12px; margin: 4px 0 0 22px; }
    .sub { margin-left: 24px; margin-top: 8px; }
    .sub label { display: block; margin: 6px 0; font-size: 13px; }
    input[type=text] {
      background: #1e1e1e; color: #eee; border: 1px solid #555;
      padding: 5px 8px; border-radius: 3px; font-family: Consolas, monospace; font-size: 13px;
    }
    #wsUrl { width: 320px; }
    .err {
      display: none; color: #f48771; font-size: 13px;
      margin: 4px 0 12px; padding: 8px 10px;
      background: #3a1d1d; border: 1px solid #7a3b3b; border-radius: 4px;
    }
    button {
      background: #0e639c; color: #fff; border: none;
      padding: 8px 20px; border-radius: 4px; cursor: pointer; font-size: 14px;
    }
    button:hover { background: #1177bb; }
    button:disabled { background: #555; cursor: wait; }
  </style>
</head>
<body>
  <h1>ShinInspector 设置</h1>
  <p class="hint">选择远程通信方式（地址/域名在此一并配置）</p>

  <div class="field">
    <label><input type="radio" name="mode" value="ipc" checked> 进程间通信（IPC）</label>
    <div class="desc">WebView2 共享内存 + postMessage，本机零拷贝</div>
  </div>

  <div class="field">
    <label><input type="radio" name="mode" value="ws"> WebSocket（WS）</label>
    <div class="desc">连接 IObject 内置 WebSocket 服务端</div>
    <div class="sub" id="wsConfig" style="display:none">
      <label>地址 <input id="wsUrl" type="text" placeholder="ws://127.0.0.1:9002"></label>
      <label>domain <input id="wsDomain" type="text" placeholder="shininspector"></label>
    </div>
  </div>

  <div id="err" class="err"></div>

  <button id="btnGo">进入调试</button>

  <script type="module" src="/settings.js"></script>
</body>
</html>
