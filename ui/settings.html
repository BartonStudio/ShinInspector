<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShinInspector 设置</title>
  <script src="vendor/iobject-sdk.js?v=1"></script>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; padding: 32px;
      background: #1e1e1e; color: #eee;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p.hint { color: #9cdcfe; font-size: 13px; margin: 0 0 20px; }
    .field { margin: 0 0 14px; padding: 12px 14px; background: #252526; border: 1px solid #444; border-radius: 6px; }
    .field label { cursor: pointer; font-size: 14px; }
    .field .desc { color: #9cdcfe; font-size: 12px; margin: 4px 0 0 22px; }
    .sub { margin-left: 24px; margin-top: 8px; }
    .sub label { display: block; margin: 6px 0; font-size: 13px; }
    input[type=text] {
      background: #1e1e1e; color: #eee; border: 1px solid #555;
      padding: 5px 8px; border-radius: 3px; font-family: Consolas, monospace; font-size: 13px;
    }
    #wsUrl { width: 320px; }
    .err {
      display: none; color: #f48771; font-size: 13px;
      margin: 4px 0 12px; padding: 8px 10px;
      background: #3a1d1d; border: 1px solid #7a3b3b; border-radius: 4px;
    }
    button {
      background: #0e639c; color: #fff; border: none;
      padding: 8px 20px; border-radius: 4px; cursor: pointer; font-size: 14px;
    }
    button:hover { background: #1177bb; }
    button:disabled { background: #555; cursor: wait; }
  </style>
</head>
<body>
  <h1>ShinInspector 设置</h1>
  <p class="hint">选择远程通信方式（地址/域名在此一并配置）</p>

  <div class="field">
    <label><input type="radio" name="mode" value="ipc" checked> 进程间通信（IPC）</label>
    <div class="desc">WebView2 共享内存 + postMessage，本机零拷贝</div>
  </div>

  <div class="field">
    <label><input type="radio" name="mode" value="ws"> WebSocket（WS）</label>
    <div class="desc">连接 IObject 内置 WebSocket 服务端</div>
    <div class="sub" id="wsConfig" style="display:none">
      <label>地址 <input id="wsUrl" type="text" placeholder="ws://127.0.0.1:9002"></label>
      <label>domain <input id="wsDomain" type="text" placeholder="shininspector"></label>
    </div>
  </div>

  <div id="err" class="err"></div>

  <button id="btnGo">进入调试</button>

  <script>
    const $ = (id) => document.getElementById(id);

    // 回显上次设置
    const saved = localStorage.getItem('shin.mode') || 'ipc';
    if (saved === 'ws') {
      document.querySelector('input[name="mode"][value="ws"]').checked = true;
      $('wsConfig').style.display = 'block';
    }
    $('wsUrl').value = localStorage.getItem('shin.wsUrl') || 'ws://127.0.0.1:9002';
    $('wsDomain').value = localStorage.getItem('shin.wsDomain') || 'shininspector';

    document.querySelectorAll('input[name="mode"]').forEach((r) => {
      r.onchange = () => { $('wsConfig').style.display = (r.value === 'ws' ? 'block' : 'none'); };
    });

    function showError(msg) {
      $('err').textContent = msg;
      $('err').style.display = 'block';
    }
    function clearError() { $('err').style.display = 'none'; }

    // 用一次真实 Connect 握手校验「地址 + 域名」；只有服务端认这个域名才返回成功。
    // 域名不对时 WS 服务端在首帧路由阶段直接断连，SDK 的 onclose 会立即 reject（无需超时兜底）。
    async function validateWs(url, domain) {
      await IObjectSDK.IObjectClient.connect(url, { domain });
    }

    $('btnGo').onclick = async () => {
      clearError();
      const mode = document.querySelector('input[name="mode"]:checked').value;

      if (mode === 'ws') {
        const url = $('wsUrl').value.trim() || 'ws://127.0.0.1:9002';
        const domain = $('wsDomain').value.trim() || 'shininspector';
        $('btnGo').disabled = true;
        $('btnGo').textContent = '校验中…';
        try {
          await validateWs(url, domain); // 校验失败会抛异常，停在本页
          localStorage.setItem('shin.mode', 'ws');
          localStorage.setItem('shin.wsUrl', url);
          localStorage.setItem('shin.wsDomain', domain);
          location.href = 'index.html';
        } catch (e) {
          const why = (e && (e.message || e.code)) || String(e);
          showError('无法进入调试页：' + why + '（请检查地址与域名；domain 必须与宿主注册的路由键逐字一致，当前为 "shininspector"）');
        } finally {
          $('btnGo').disabled = false;
          $('btnGo').textContent = '进入调试';
        }
        return;
      }

      // IPC 本机零拷贝，无地址/域名可校验，直接进入。
      localStorage.setItem('shin.mode', 'ipc');
      location.href = 'index.html';
    };
  </script>
</body>
</html>
