<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>SHIN::INSPECTOR</title>
  <link rel="stylesheet" href="/styles/app.css">
</head>
<body>
  <header id="app-head">
    <div id="toolbar"></div>
    <div id="conn-hint" class="hidden"></div>
  </header>

  <main>
    <section id="stage">
      <div id="graph-host"></div>
      <div id="stage-bar"></div>
      <div id="stage-hint"></div>
      <div class="legend">
        <span><i data-c="root"></i>root</span>
        <span><i data-c="normal"></i>普通对象</span>
        <span><i data-c="selected"></i>选中</span>
        <span><i data-c="pulse"></i>数据变化</span>
        <span><i data-c="released"></i>已 Released</span>
      </div>
    </section>

    <aside id="inspector"></aside>
  </main>

  <footer id="timeline"></footer>

  <!-- CRT 装饰层：扫描线 + 暗角。纯装饰，不吃事件。 -->
  <div class="crt" aria-hidden="true"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
